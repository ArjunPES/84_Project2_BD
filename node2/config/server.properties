# Kafka Broker Configuration for 84_Project2_BD

# Broker ID (unique for each broker)
broker.id=0

# Listeners - Where clients connect
listeners=PLAINTEXT://10.241.219.151:9092 #replace with broker ip
advertised.listeners=PLAINTEXT://10.241.219.151:9092

# Log directories
log.dirs=/tmp/kafka-logs

# ZooKeeper connection (if using ZooKeeper)
zookeeper.connect=localhost:2181

# Topic Configuration
auto.create.topics.enable=false
num.partitions=3
default.replication.factor=1

# Log retention
log.retention.hours=168
log.segment.bytes=1073741824

# Network settings
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600